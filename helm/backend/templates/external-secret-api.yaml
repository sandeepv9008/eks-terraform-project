apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.api.name }}
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.secrets.api.kubernetesSecretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secrets.api.awsSecretName }}
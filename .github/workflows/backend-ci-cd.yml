name: Backend CI / CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }} 
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: eks-demo-backend
  EKS_CLUSTER_NAME: eks-learning-cluster
  NAMESPACE: ecommerce

jobs:
  # ============================================================ # CI - Build and Push Docker Image # ============================================================
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: application/backend
        run: |
          pip install -r requirements.txt
      
      - name: Configure AWS credentials 
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::370613533967:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: application/backend
        run: |
          docker build --platform linux/amd64 \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .

      - name: Verify Docker image
        run: |
          docker images ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push Docker image to Amazon ECR
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

# ============================================================ # CD - Deploy to EKS # ============================================================

  deploy:
    name: CD - Deploy to EKS 
    runs-on: ubuntu-latest

    needs: build-and-push
    
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4 
      
      - name: Configure AWS credentials 
        uses: aws-actions/configure-aws-credentials@v5 
        with: 
          role-to-assume: arn:aws:iam::370613533967:role/github-actions-role 
          aws-region: ${{ env.AWS_REGION }} 
      
      - name: Setup kubectl 
        uses: azure/setup-kubectl@v4 
        with: 
          version: latest 

      - name: Setup Helm 
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Verify EKS access
        run: |
          kubectl get nodes

      - name: Deploy with Helm
        run: |
          helm upgrade --install backend ./helm/backend \
            --namespace $NAMESPACE \
            --create-namespace \
            --set-string image.repository=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }} \
            --set-string image.tag=${{ github.sha }} \
            --wait \
            --timeout 5m

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/backend-deployment -n $NAMESPACE --timeout=5m

          echo "=== Pods ==="
          kubectl get pods -n $NAMESPACE

          echo "=== Services ==="
          kubectl get svc -n $NAMESPACE

          echo "=== Ingress ==="
          kubectl get ingress -n $NAMESPACE

          echo "=== ExternalSecrets ===" 
          kubectl get externalsecret -n "$NAMESPACE" 
          
          echo "=== Kubernetes Secrets ===" 
          kubectl get secrets -n "$NAMESPACE"
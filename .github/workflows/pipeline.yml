name: EKS Production Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: eks-learning-cluster
  ECR_REPOSITORY: eks-demo-backend
  NAMESPACE: ecommerce
  TF_WORKING_DIR: terraform
  HELM_CHART_DIR: helm/backend
  BACKEND_DIR: application/backend

jobs:
  
  validate:
    name: Validate Code and Configuration
    runs-on: ubuntu-latest
  
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ${{env.TF_WORKING_DIR}}
        run: |
          terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -backend=false
      
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      - name: Helm Lint
        run: |
          helm lint "$HELM_CHART_DIR"

      - name: Docker file Check
        run: |
          test -f "$BACKEND_DIR/dockerfile"
          test -f "$BACKEND_DIR/requirements.txt"
          test -f "$BACKEND_DIR/app.py"

      - name: Validation Complete
        run: |
          echo "======================================"
          echo "Validation completed successfully"
          echo "======================================"
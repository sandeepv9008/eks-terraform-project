name: EKS Production Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: eks-learning-cluster
  ECR_REPOSITORY: eks-demo-backend
  NAMESPACE: ecommerce
  TF_WORKING_DIR: terraform
  HELM_CHART_DIR: helm/backend
  BACKEND_DIR: application/backend
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

  ESO_ROLE_ARN: ${{ vars.ESO_ROLE_ARN }}
  ALB_ROLE_ARN: ${{ vars.ALB_ROLE_ARN }}

jobs:
  
  validate:
    name: Validate Code and Configuration
    runs-on: ubuntu-latest
  
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ${{env.TF_WORKING_DIR}}
        run: |
          terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -backend=false
      
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      - name: Helm Lint
        run: |
          helm lint "$HELM_CHART_DIR"

      - name: Docker file Check
        run: |
          test -f "$BACKEND_DIR/dockerfile"
          test -f "$BACKEND_DIR/requirements.txt"
          test -f "$BACKEND_DIR/app.py"

      - name: Validation Complete
        run: |
          echo "======================================"
          echo "Validation completed successfully"
          echo "======================================"

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate

    steps:

      - name: checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan

    steps:
      
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve tfplan

  platform:
    name: Install Platform Components
    runs-on: ubuntu-latest
    needs: terraform-apply

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Verify cluster access
        run: |
          kubectl get nodes

      - name: Create application namespace
        run: |
          kubectl create namespace "$NAMESPACE" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Add Helm repositories
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

      - name: Install External Secrets Operator
        run: |
          helm upgrade --install external-secrets \
            external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --set serviceAccount.create=true \
            --set serviceAccount.name=external-secrets \
            --set-string "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=$ESO_ROLE_ARN"

      - name: Verify External Secrets Operator
        run: |
          kubectl get pods -n external-secrets
          kubectl get serviceaccount \
            external-secrets \
            -n external-secrets \
            -o yaml

      - name: Get VPC ID
        run: |
          VPC_ID=$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.resourcesVpcConfig.vpcId' \
            --output text)

          echo "VPC_ID=$VPC_ID"
          echo "VPC_ID=$VPC_ID" >> "$GITHUB_ENV"

      - name: Install AWS Load Balancer Controller
        run: |
          helm upgrade --install aws-load-balancer-controller \
            eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="$EKS_CLUSTER_NAME" \
            --set region="$AWS_REGION" \
            --set vpcId="$VPC_ID" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set-string "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=$ALB_ROLE_ARN"

      - name: Verify AWS Load Balancer Controller
        run: |
          kubectl get pods -n kube-system \
            | grep aws-load-balancer-controller || true

      - name: Verify platform
        run: |
          echo "=== Nodes ==="
          kubectl get nodes

          echo "=== External Secrets ==="
          kubectl get pods -n external-secrets

          echo "=== Load Balancer Controller ==="
          kubectl get pods -n kube-system \
            | grep aws-load-balancer-controller || true

          echo "=== Application Namespace ==="
          kubectl get namespace "$NAMESPACE"

  application:
    name: Build and Deploy Application
    runs-on: ubuntu-latest
    needs: platform

    steps:

      - name:  Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          docker build \
            -t "$ECR_REPOSITORY:$GITHUB_SHA" \
            .

      - name: Tag Docker image
        run: |
          docker tag \
            "$ECR_REPOSITORY:$GITHUB_SHA" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

      - name: Push Docker image
        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Verify cluster access
        run: |
          kubectl get nodes

      - name: Deploy application with Helm
        run: |
          helm upgrade --install backend \
            "$HELM_CHART_DIR" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$GITHUB_SHA"

      - name: Verify Helm deployment
        run: |
          helm status backend \
            --namespace "$NAMESPACE"

          kubectl get pods \
            -n "$NAMESPACE"

          kubectl get deployment \
            -n "$NAMESPACE"

          kubectl get service \
            -n "$NAMESPACE"

      - name: Verify External Secrets
        run: |
          echo "=== SecretStore ==="
          kubectl get secretstore \
            -n "$NAMESPACE" \
            -o wide

          echo "=== ExternalSecrets ==="
          kubectl get externalsecret \
            -n "$NAMESPACE" \
            -o wide

          echo "=== Kubernetes Secrets ==="
          kubectl get secrets \
            -n "$NAMESPACE"

      - name: Wait for External Secrets
        run: |
          echo "Waiting for External Secrets to become Ready..."

          kubectl wait \
            --for=condition=Ready \
            externalsecret/backend-db-external-secret \
            -n "$NAMESPACE" \
            --timeout=120s

          kubectl wait \
            --for=condition=Ready \
            externalsecret/backend-api-external-secret \
            -n "$NAMESPACE" \
            --timeout=120s

          echo "External Secrets are ready."

      - name: Wait for application rollout
        run: |
          kubectl rollout status \
            deployment/backend \
            -n "$NAMESPACE" \
            --timeout=180s

      - name: Show application state
        run: |
          echo "=============================="
          echo "DEPLOYMENTS"
          echo "=============================="
          kubectl get deployments -n "$NAMESPACE"

          echo "=============================="
          echo "PODS"
          echo "=============================="
          kubectl get pods -n "$NAMESPACE" -o wide

          echo "=============================="
          echo "SERVICES"
          echo "=============================="
          kubectl get svc -n "$NAMESPACE"

          echo "=============================="
          echo "INGRESS"
          echo "=============================="
          kubectl get ingress -n "$NAMESPACE"

  smoke-test:
    name: Application Smoke Test
    runs-on: ubuntu-latest
    needs: application

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Get ALB address
        run: |
          echo "Waiting for ALB address..."

          for i in {1..30}; do

            ALB=$(kubectl get ingress backend-ingress \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)

            if [ -n "$ALB" ]; then
              echo "ALB address: $ALB"
              echo "ALB_HOSTNAME=$ALB" >> "$GITHUB_ENV"
              break
            fi

            echo "ALB not ready yet. Waiting..."
            sleep 10

          done

          if [ -z "$ALB_HOSTNAME" ]; then
            echo "ERROR: ALB hostname was not created."
            kubectl get ingress -n "$NAMESPACE"
            exit 1
          fi

      - name: Test application
        run: |
          echo "Testing:"
          echo "http://$ALB_HOSTNAME/api/products"

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 10 \
            --retry-delay 10 \
            "http://$ALB_HOSTNAME/api/products"

      - name: Smoke test successful
        run: |
          echo "======================================"
          echo "Application smoke test PASSED"
          echo "======================================"